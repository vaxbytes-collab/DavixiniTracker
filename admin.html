<script>
  try { const s = JSON.parse(localStorage.getItem('dt-settings') || '{}'); const t = s.theme === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : (s.theme || 'dark'); document.documentElement.dataset.theme = t; if (s.accent) document.documentElement.style.setProperty('--accent', s.accent); } catch (e) { /* por defecto */ }
</script>
