<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Música del Davixiniverso: artistas, álbumes y canciones.">
<meta name="google-site-verification" content="CUzBkj9r5Rlb0arR5-WMaefe9Z3sVEmcw8puXCGtUJ0">
<meta property="og:title" content="davixiniTracker">
<meta property="og:description" content="Música del Davixiniverso: artistas, álbumes y canciones.">
<meta property="og:type" content="website">
<title>davixiniTracker</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <a class="logo" href="#/">davixiniTracker</a>
  <nav id="nav" aria-label="Navegación">
    <a href="#/songs" data-p="songs">Canciones</a>
    <a href="#/albums" data-p="albums">Álbumes</a>
    <a href="#/artists" data-p="artists">Artistas</a>
    <a href="#/likes" data-p="likes">Me gusta</a>
  </nav>
  <input id="q" type="search" placeholder="Buscar ( / )" aria-label="Buscar">
</header>
<main id="view"><p class="sub">Cargando…</p></main>
<footer class="player" id="player" hidden>
  <div class="now"><div class="pa" id="pArt"></div><div><b id="pTitle"></b><span id="pArtist"></span></div></div>
  <div class="mid">
    <div class="ctl">
      <button id="shuf" aria-pressed="false">Aleatorio</button>
      <button id="prev">Anterior</button>
      <button id="play">Reproducir</button>
      <button id="next">Siguiente</button>
      <button id="rep" aria-pressed="false">Repetir</button>
    </div>
    <div class="seekrow"><time id="el">0:00</time><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Posición"><time id="tot">0:00</time></div>
  </div>
  <div class="tools">
    <button id="pLike" aria-pressed="false">Me gusta</button>
    <button id="qBtn">Cola</button>
    <input id="vol" type="range" min="0" max="1" step="0.01" aria-label="Volumen">
  </div>
</footer>
<dialog id="queue"><h2>Cola</h2><div id="qList"></div><form method="dialog"><button class="btn">Cerrar</button></form></dialog>
<div id="toast" hidden></div>
<audio id="au" preload="metadata"></audio>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
